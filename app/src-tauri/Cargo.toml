[package]
name = "multichat"
version = "0.1.0"
description = "Group chat where everyone brings their own AI"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "multichat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "http2", "charset"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
async-trait = "0.1"
async-stream = "0.3"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
rmcp = { version = "3.8", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
base64 = "0.22"
tauri-plugin-websocket = "2"
tauri-plugin-notification = "2"

# stdio MCP servers spawn local child processes, which iOS (and Android) forbid:
# on mobile only the Streamable HTTP transport is compiled in.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
rmcp = { version = "3.8", default-features = false, features = ["transport-child-process"] }
# The desktop app can host the relay for friends (Settings > General); phones can't
# keep a server running in the background, so it isn't compiled in there.
multichat-relay = { path = "../../server" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
